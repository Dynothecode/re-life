<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset">
<link rel="manifest" href="manifest.json">
<title>Reset Harian</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0b1020; color:#e5e7eb;
         padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:1.4rem; margin:0 0 14px; }
  .card { background:#131a30; border-radius:16px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:#9ca3af; margin:10px 0 4px; }
  input[type=range] { width:100%; }
  textarea, input[type=text] { width:100%; padding:10px; border-radius:10px; border:1px solid #2a3350;
    background:#0b1020; color:#e5e7eb; font:inherit; margin-top:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1; min-width:110px; padding:11px 14px; border-radius:12px; border:0;
           background:#3b82f6; color:#fff; font-weight:600; font-size:.95rem; }
  button.secondary { background:#2a3350; }
  .habit { display:flex; justify-content:space-between; align-items:center;
           padding:8px 0; border-bottom:1px solid #1f2743; }
  .value { color:#93c5fd; font-weight:600; }
  .streak { font-size:.85rem; color:#9ca3af; text-align:center; margin-top:12px; }
</style>
</head>
<body>
<h1>Reset Harian</h1>

<div class="card">
  <label>Mood (1–5)</label>
  <input type="range" id="mood" min="1" max="5" value="3">
  <div class="value"><span id="moodV">3</span>/5</div>

  <label>Energi (1–5)</label>
  <input type="range" id="energy" min="1" max="5" value="3">
  <div class="value"><span id="energyV">3</span>/5</div>
</div>

<div class="card">
  <label>Jurnal</label>
  <textarea id="journal" rows="4" placeholder="Hari ini..."></textarea>

  <label>3 Hal Bersyukur</label>
  <input type="text" id="g1" placeholder="1...">
  <input type="text" id="g2" placeholder="2...">
  <input type="text" id="g3" placeholder="3...">
</div>

<div class="card">
  <label>Habit</label>
  <div id="habits"></div>
</div>

<div class="row">
  <button id="save">Simpan</button>
  <button id="export" class="secondary">Export</button>
</div>
<div class="row" style="margin-top:8px">
  <button id="importBtn" class="secondary">Import</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>
<p class="streak" id="streak"></p>

<script>
const KEY='reset-data-v1';
const HABITS=['Olahraga','Baca','Tidur Cukup','No Scroll'];
const today=new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);

const load=()=>{ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } };
const save=d=>localStorage.setItem(KEY, JSON.stringify(d));

let db=load();
const entry=db[today]||{mood:3,energy:3,journal:'',gratitude:['','',''],habits:{}};

$('mood').value=entry.mood;
$('energy').value=entry.energy;
$('journal').value=entry.journal;
['g1','g2','g3'].forEach((id,i)=>$(id).value=entry.gratitude[i]||'');

HABITS.forEach(h=>{
  const div=document.createElement('div');
  div.className='habit';
  div.innerHTML=`<span>${h}</span><input type="checkbox" data-h="${h}" ${entry.habits[h]?'checked':''}>`;
  $('habits').appendChild(div);
});

const syncVals=()=>{ $('moodV').textContent=$('mood').value; $('energyV').textContent=$('energy').value; };
['mood','energy'].forEach(id=>$(id).addEventListener('input',syncVals));
syncVals();

function streak(data){
  let s=0, d=new Date();
  while(true){
    const k=d.toISOString().slice(0,10);
    if(data[k]){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}
$('streak').textContent='🔥 Streak: '+streak(db)+' hari';

$('save').onclick=()=>{
  const d=load(); const habits={};
  document.querySelectorAll('[data-h]').forEach(cb=>habits[cb.dataset.h]=cb.checked);
  d[today]={ mood:+$('mood').value, energy:+$('energy').value,
    journal:$('journal').value,
    gratitude:['g1','g2','g3'].map(id=>$(id).value), habits };
  save(d);
  $('streak').textContent='🔥 Streak: '+streak(d)+' hari';
  $('save').textContent='Tersimpan ✓';
  setTimeout(()=>$('save').textContent='Simpan',1200);
};

$('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='reset-backup-'+today+'.json';
  a.click();
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ save(JSON.parse(r.result)); location.reload(); }
                 catch{ alert('File tidak valid'); } };
  r.readAsText(f);
};
</script>
</body>
</html>
